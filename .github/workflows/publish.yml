name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Install .NET 10+ SDK. Remove this step once runners ship with it.
      # If .NET 10 is still in preview, add: include-prerelease: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Validate tag matches .csproj version
        run: ./tools/check-tag-version.sh "${GITHUB_REF_NAME}"

      - name: Restore
        run: dotnet restore tests/Spire.CoreCLR.slnx -p:EnableSourceControlManagerQueries=false

      - name: Build
        run: dotnet build tests/Spire.CoreCLR.slnx -c Release --no-restore -p:EnableSourceControlManagerQueries=false

      - name: Test
        run: >-
          dotnet test tests/Spire.CoreCLR.slnx -c Release --no-build --no-restore
          -p:EnableSourceControlManagerQueries=false --filter 'Environment!=Unity' --logger trx

      - name: Pack all projects
        run: |
          dotnet pack src/Houtamelo.Spire/ -c Release --no-build -o ./nupkgs
          dotnet pack src/Houtamelo.Spire.Analyzers/ -c Release --no-build -o ./nupkgs
          dotnet pack src/Houtamelo.Spire.CodeFixes/ -c Release --no-build -o ./nupkgs

      - name: Push to NuGet
        run: >
          dotnet nuget push
          ./nupkgs/*.nupkg
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
